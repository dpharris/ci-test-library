[platformio]
# Force PlatformIO to look at the project root as a library folder
lib_extra_dirs = .
# Force the build framework to link the root folder as a main dependency
lib_deps = .
# Tell PlatformIO where to find the sketch file to compile
src_dir = examples/BasicUsage

[env]
framework = arduino

# --- Test 1: The classic 8-bit Uno ---
[env:uno]
platform = atmelavr
board = uno

# --- Test 2: The 32-bit ESP32 ---
[env:esp32]
platform = espressif32
board = esp32dev

name: PlatformIO Test Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Installs Python on the runner
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-cache-dependency-path: ''

    # Installs PlatformIO on the runner
    - name: Install PlatformIO
      run: pip install -U platformio

    # DEFINITIVE STEP: Run CI against your example sketch
    # --lib="." links your root src/ folder natively as a library
    # --board installs the precise cross-compilation hardware profiles
    - name: Run Library Example Compilation
      run: |
        pio ci --lib="." --board=uno --board=esp32dev examples/BasicUsage/BasicUsage.ino

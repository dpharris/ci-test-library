name: PlatformIO Test Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-cache-dependency-path: ''

    - name: Install PlatformIO
      run: pip install -U platformio

    # Links your local root src/ folder natively as a library
    - name: Run Library Example Compilation
      run: |
        pio ci --lib="." --board=uno --board=esp32dev examples/BasicUsage/BasicUsage.ino
        pio ci --lib="." --board=uno --board=esp32dev examples/test/test.ino
        pio ci --lib="." --lib="https : / / github . com / openlcb / OpenLCB_Single_Thread . git" --board=uno --board=esp32dev examples/test/test.ino
